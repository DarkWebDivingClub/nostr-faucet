# nostr-faucet — one instance per miner.
#
# This process can spend the miner's wallet. Everything below is chosen with
# that in mind.

[nostr]
# The faucet dials out. It never listens on a port, so running it beside a
# miner adds nothing to that host's firewall.
relay = "wss://relay.dwdc.club"
secret_key = "nsec1..."
# The only key that may pause, resume or change policy. If this is absent,
# nobody can control the faucet — not everybody. Failing closed is the only
# safe default for a service that can spend a wallet.
control_pubkey = "..."

[bitcoind]
# Keep this on localhost. It is the whole reason there is one faucet per
# miner rather than one faucet serving both chains.
rpc_host = "127.0.0.1"
rpc_port = 38332
rpc_user = "..."
rpc_password = "..."
wallet = "signer"
# Both signets report network "signet", so this label is what tells them
# apart in logs and in get_info.
chain_label = "btk.signet"

[policy]
# One coin a week per key.
per_key_sat = 100000000
window_secs = 604800

# What the faucet pays out in total per window, across every key.
#
# This is the control that matters. A per-key quota is advisory against
# anyone willing to generate keys, which costs nothing on Nostr. This bounds
# the damage regardless, and is refused even to a key inside its own quota.
total_cap_sat = 5000000000

# Requests one key may make per window, paid or refused. A script that asks
# a thousand times and is refused a thousand times still costs a thousand
# round trips.
max_requests_per_window = 20

paused = false
