# nostr-faucet — one instance per miner.
#
# This process can spend the miner's wallet. Everything below is chosen with
# that in mind.

[nostr]
# The faucet dials out. It never listens on a port, so running it beside a
# miner adds nothing to that host's firewall.
relay = "wss://relay.dwdc.club"
secret_key = "nsec1..."
# The only key that may pause, resume or change policy. If this is absent,
# nobody can control the faucet — not everybody. Failing closed is the only
# safe default for a service that can spend a wallet.
control_pubkey = "..."

[bitcoind]
# Keep this on localhost. It is the whole reason there is one faucet per
# miner rather than one faucet serving both chains.
rpc_host = "127.0.0.1"
rpc_port = 38332
rpc_user = "..."
rpc_password = "..."
wallet = "signer"
# Both signets report network "signet", so this label is what tells them
# apart in logs and in get_info.
chain_label = "btk.signet"

[policy]
# The allowance a key gets when it holds no grant of its own. This is what
# makes the faucet open: a stranger is treated as if granted it. Remove the
# whole [policy.default_profile] section and the faucet becomes a
# whitelist — a key with no grant has no allowance.
#
# Per-key allowances otherwise arrive as kind-30078 grants, per NNC. This
# service does not invent a way to set them.

[policy.default_profile.quota]
# NOTE: rate_per_micro is an integer number of sats per MICROSECOND, so it
# cannot express a weekly refill. One coin a week is 0.000165 sat/us, which
# truncates to 0 — the smallest non-zero rate expressible is a million sat
# a second.
#
# So this reads as "one coin, until the operator republishes the grant",
# and the faucet's refusal says exactly that rather than promising a refill
# that never arrives.
rate_per_micro = 0
max_capacity = 100000000

[policy.default_profile.access_rate]
# Requests, paid or refused. A script that asks a thousand times and is
# refused a thousand times still costs a thousand round trips.
rate_per_micro = 0
max_capacity = 20

[policy.total_cap]
# What the faucet pays out in total, across every key. The control that
# matters: a per-key quota is advisory against anyone willing to generate
# keys, which costs nothing on Nostr.
rate_per_micro = 0
max_capacity = 10000000000

[policy]
paused = false
