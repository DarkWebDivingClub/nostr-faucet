# nostr-faucet — one instance per miner.
#
# This process can spend the miner's wallet. Everything below is chosen with
# that in mind.
#
# There is very little here, and that is the point. Who may ask, how often
# and how much are **grants**, published by an owner as kind-30198 events —
# see "Policy" at the bottom. The faucet does not invent a way to set them,
# because NNC already answered the question.

[nostr]
# The faucet dials out. It never listens on a port, so running it beside a
# miner adds nothing to that host's firewall.
relay = "wss://relay.dwdc.club"
secret_key = "nsec1..."

# The keys whose grants this faucet accepts. Nothing else can authorize
# anything, whatever it publishes to the relay.
#
# EMPTY ACCEPTS NOTHING, and the faucet then answers nothing. That is
# deliberate: absent configuration fails closed rather than being read as
# "any owner", which is dln-node#1.
owners = ["npub1..."]

[bitcoind]
# Keep this on localhost. It is the whole reason there is one faucet per
# miner rather than one faucet serving both chains.
rpc_host = "127.0.0.1"
rpc_port = 38332
rpc_user = "..."
rpc_password = "..."
wallet = "signer"
# Both signets report network "signet", so this label is what tells them
# apart in logs and in get_info.
chain_label = "btk.signet"

[faucet.total_cap]
# What the faucet pays out in total, across every key.
#
# The one limit that is not a grant, and cannot be. A grant answers "may
# this key do this", which the access layer enforces per key. This answers
# "can the faucet afford it at all" — a property of the faucet, closer to
# insufficient balance than to authorization.
#
# It is also the control that actually matters. A per-key quota is advisory
# against anyone willing to generate keys, which costs nothing on Nostr.
# This is the number that bounds the loss.
#
# A token bucket: `amount` sats refill every `per_secs`, up to
# `max_capacity`. Below is 100 coins a day, holding at most 100.
amount = 10000000000
per_secs = 86400
max_capacity = 10000000000

# ── Policy ───────────────────────────────────────────────────────────────
#
# Not here. An owner publishes a kind-30198 grant per key:
#
#   {
#     "kind": 30198,
#     "pubkey": "<owner>",
#     "tags": [["d", "<faucet_pubkey>:<asker_pubkey>"],
#              ["p", "<faucet_pubkey>"]],
#     "content": "{\"methods\":{\"OTHERS\":{}},
#                  \"quota\":{\"amount\":100000000,
#                             \"per_secs\":604800,
#                             \"max_capacity\":100000000}}"
#   }
#
# One coin a week, and every method the faucet implements.
#
# An OPEN faucet uses the literal asker `OTHERS`, which applies to any key
# with no grant of its own. Revoking that grant — publishing it with content
# `{}` — is how a faucet closes. There is no pause method, and the change
# takes effect without a restart, because a grant is an event.
